# ==========================================================================
# LinkHygiene — Docker Compose for AWS EC2 / Lightsail / local production
# Usage: docker compose up -d
# ==========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkhygiene-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/linkhygiene.db
      - PORT=3000
    volumes:
      - linkhygiene-data:/app/data
    # Resource limits to prevent abuse
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  linkhygiene-data:
    driver: local
